<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Guillaume Delaunay</title>
<meta name="description" content="CV de Guillaume Delaunay, technico-commercial nautique.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
<style>
:root { --bg:#ecebea; --fg:#151515; --muted:#5d5c5a; --edge:rgba(0,0,0,.14); --accent:#0a66c2; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1b1c; --fg:#f1f0ee; --muted:#a3a29e; --edge:rgba(0,0,0,.6); --accent:#62a8ee; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Montserrat","Helvetica Neue",Arial,sans-serif; padding:28px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
.wrap { max-width:860px; margin-inline:auto; display:flex; flex-direction:column; gap:20px; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; }
h1 { margin:0; font-weight:800; font-size:clamp(1.4rem,5vw,2rem); }
header p { margin:4px 0 0; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.btn { font-weight:600; font-size:.85rem; color:#fff; background:var(--accent); padding:10px 16px; text-decoration:none; }
.btn:focus-visible { outline:3px solid var(--fg); outline-offset:2px; }
.sheet { display:block; width:100%; height:auto; background:#fff; box-shadow:0 1px 2px var(--edge), 0 10px 30px var(--edge); }
footer { font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Guillaume Delaunay</h1><p>Technico-commercial nautique</p></div>
    <a class="btn" href="CV_Guillaume_Delaunay.pdf" download>Télécharger le PDF</a>
  </header>
  <img class="sheet" src="cv.jpg" alt="CV de Guillaume Delaunay, technico-commercial nautique : expériences chez Catamaran Company (BVI), Bartoli Marine, Husson Marine et Locn'Tour, formation INB Bretagne.">
  <footer>guillaumedelaunay@icloud.com · +33 6 03 80 57 15 · +1 284 540 5101</footer>
</div>
</body>
</html>
